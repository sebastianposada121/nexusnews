<section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
  <div class="mb-8 space-y-6">
    <div>
      <h1 class="text-3xl font-black text-slate-900 tracking-tight">Catálogo Digital de Noticias</h1>
      <p class="text-slate-500 text-sm mt-1">Explora experiencias informativas clasificadas y actualizadas en tiempo real.</p>
    </div>

    <div class="flex flex-col md:flex-row gap-4 items-start md:items-center justify-between bg-white p-4 rounded-2xl border border-slate-200 shadow-sm">
      <div class="flex flex-wrap gap-2">
        <button
          (click)="filterBy('Todas')"
          [class]="categoryPillClass(selectedCategory() === 'Todas')">
          Todas
        </button>
        @for (cat of categories; track cat.name) {
          <button
            (click)="filterBy(cat.name)"
            [class]="categoryPillClass(selectedCategory() === cat.name)">
            {{ cat.name }}
          </button>
        }
      </div>

      <div class="relative w-full md:w-72">
        <input
          type="text"
          [value]="articleState.searchQuery()"
          (input)="onSearchInput($event)"
          placeholder="Filtrar por palabra clave..."
          class="w-full pl-9 pr-4 py-2 bg-slate-100 focus:bg-white text-sm rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500"
        />
        <svg class="w-4 h-4 text-slate-400 absolute left-3 top-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
      </div>
    </div>
  </div>

  @if (filteredArticles().length > 0) {
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
      @for (article of filteredArticles(); track article.id) {
        <app-article-card [article]="article" />
      }
    </div>
  } @else {
    <app-empty-state
      icon="search"
      title="No se encontraron noticias"
      description="Prueba ajustando los términos de búsqueda o seleccionando otra categoría."
      actionLabel="Restablecer filtros"
      (action)="resetFilters()" />
  }
</section>
