<section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
  <div class="mb-8">
    <h1 class="text-3xl font-black text-slate-900 tracking-tight">Gestión de Noticias (Mini-CRUD)</h1>
    <p class="text-slate-500 text-sm mt-1">Crea nuevas noticias o administra y elimina publicaciones existentes.</p>
  </div>

  <div class="grid grid-cols-1 lg:grid-cols-12 gap-10">

    <div class="lg:col-span-5 bg-white p-6 sm:p-8 rounded-3xl border border-slate-200 shadow-sm h-fit">
      <h2 class="text-xl font-bold text-slate-900 mb-6 flex items-center gap-2">
        <svg class="w-5 h-5 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
        Crear Nueva Noticia
      </h2>
      <app-article-form />
    </div>

    <div class="lg:col-span-7 space-y-4">
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-xl font-bold text-slate-900">Listado de Noticias ({{ articles().length }})</h2>
        <button
          (click)="restoreDefaults()"
          class="text-xs font-bold text-indigo-600 hover:underline">
          Restablecer Noticias Iniciales
        </button>
      </div>

      <div class="space-y-3">
        @for (art of articles(); track art.id) {
          <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm flex items-center justify-between gap-4">
            <div class="flex items-center gap-4 min-w-0">
              <img [src]="art.image" [alt]="art.title" class="w-16 h-16 rounded-xl object-cover flex-shrink-0 bg-slate-100"/>
              <div class="min-w-0">
                <div class="flex items-center gap-2">
                  <span class="px-2 py-0.5 rounded text-[10px] font-bold bg-slate-100 text-slate-700">{{ art.category }}</span>
                  <span class="text-xs text-slate-400">{{ art.date }}</span>
                </div>
                <h4 class="font-bold text-slate-900 text-sm truncate mt-1">{{ art.title }}</h4>
                <p class="text-xs text-slate-500">Por {{ art.author }}</p>
              </div>
            </div>

            <div class="flex items-center gap-2 flex-shrink-0">
              <a
                [routerLink]="['/noticias', art.id]"
                class="p-2 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 transition-colors"
                title="Ver Noticia">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
              </a>
              <button
                (click)="deleteArticle(art.id)"
                class="p-2 rounded-lg bg-rose-50 hover:bg-rose-100 text-rose-600 transition-colors"
                title="Eliminar Noticia">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
              </button>
            </div>
          </div>
        }
      </div>
    </div>
  </div>
</section>
