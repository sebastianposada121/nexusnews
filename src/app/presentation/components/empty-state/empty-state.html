<div class="bg-white rounded-3xl p-12 text-center border border-slate-200 max-w-lg mx-auto my-12">
  <div
    [class]="icon() === 'star' ? 'bg-amber-50 text-amber-500' : 'bg-indigo-50 text-indigo-600'"
    class="w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4">
    @if (icon() === 'star') {
      <svg class="w-8 h-8" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
    } @else {
      <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
    }
  </div>
  <h3 class="text-lg font-bold text-slate-900">{{ title() }}</h3>
  @if (description()) {
    <p class="text-sm text-slate-500 mt-1 mb-6">{{ description() }}</p>
  }
  @if (actionLabel()) {
    <button
      (click)="action.emit()"
      class="px-5 py-2.5 rounded-xl bg-indigo-600 text-white font-semibold text-sm hover:bg-indigo-700 transition-colors">
      {{ actionLabel() }}
    </button>
  }
</div>
