@let hero = article();
<section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 sm:py-12">
  <div class="relative rounded-3xl overflow-hidden shadow-2xl bg-slate-900 text-white grid grid-cols-1 lg:grid-cols-12 min-h-[480px]">
    <div class="lg:col-span-7 relative z-10 p-8 sm:p-12 lg:p-16 flex flex-col justify-between bg-gradient-to-t lg:bg-gradient-to-r from-slate-950 via-slate-950/90 to-transparent">
      <div>
        <div class="flex items-center gap-3 mb-4">
          <span class="px-3 py-1 rounded-full text-xs font-bold bg-indigo-500 text-white tracking-wide uppercase">
            {{ hero.category }}
          </span>
          <span class="text-xs text-slate-400 font-medium">{{ hero.date }}</span>
        </div>
        <h1 class="text-3xl sm:text-4xl lg:text-5xl font-extrabold leading-tight tracking-tight mb-4 text-white">
          {{ hero.title }}
        </h1>
        <p class="text-slate-300 text-base sm:text-lg mb-6 line-clamp-3 font-normal">
          {{ hero.summary }}
        </p>
      </div>
      <div class="flex flex-wrap items-center gap-4 pt-4">
        <a
          [routerLink]="['/noticias', hero.id]"
          class="px-6 py-3.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-sm shadow-lg shadow-indigo-600/30 transition-all flex items-center gap-2">
          <span>Leer artículo completo</span>
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
        </a>
        <button
          (click)="toggleFavorite(hero.id)"
          class="p-3.5 rounded-xl bg-white/10 hover:bg-white/20 text-white backdrop-blur-md transition-all">
          <svg class="w-5 h-5" [class.text-amber-400]="isFavorite(hero.id)" [class.fill-current]="isFavorite(hero.id)" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z"/>
          </svg>
        </button>
      </div>
    </div>
    <div class="lg:col-span-5 relative h-64 lg:h-auto overflow-hidden">
      <img [src]="hero.image" [alt]="hero.title" class="w-full h-full object-cover transform hover:scale-105 transition-transform duration-700"/>
      <div class="absolute inset-0 bg-gradient-to-t from-slate-950 lg:hidden"></div>
    </div>
  </div>
</section>
