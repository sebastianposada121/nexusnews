<section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-14 bg-slate-50/60">
  <div class="text-center max-w-2xl mx-auto mb-12">
    <span class="inline-block px-3 py-1 rounded-full bg-indigo-100 text-indigo-700 text-xs font-bold uppercase tracking-wider">
      Testimonios
    </span>
    <h2 class="text-3xl font-black text-slate-900 tracking-tight mt-3">
      Lo que dice nuestra comunidad
    </h2>
    <p class="text-slate-500 text-sm mt-2">
      Lectores, docentes y emprendedores que confían en Nexus News cada día.
    </p>
  </div>

  @if (loading() && testimonials().length === 0) {
    <div class="flex justify-center py-10">
      <div class="w-10 h-10 border-4 border-indigo-200 border-t-indigo-600 rounded-full animate-spin"></div>
    </div>
  } @else {
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
      @for (testimonial of testimonials(); track testimonial.id) {
        <figure class="bg-white rounded-3xl border border-slate-200 shadow-sm p-8 flex flex-col hover:shadow-lg transition-shadow">
          <svg class="w-8 h-8 text-indigo-200 mb-4" fill="currentColor" viewBox="0 0 24 24">
            <path d="M9.983 3v7.391c0 5.704-3.731 9.57-8.983 10.609l-.995-2.151c2.432-.917 3.995-3.638 3.995-5.849h-4v-10h9.983zm14.017 0v7.391c0 5.704-3.748 9.571-9 10.609l-.996-2.151c2.433-.917 3.996-3.638 3.996-5.849h-3.983v-10h9.983z"/>
          </svg>

          <blockquote class="text-sm text-slate-700 leading-relaxed flex-grow">
            "{{ testimonial.text }}"
          </blockquote>

          <div class="flex items-center gap-1 mt-6 text-amber-500">
            @for (star of stars(testimonial.rating); track star) {
              <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20">
                <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.949.684h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.784.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.915a1 1 0 00.95-.69l1.519-4.674z"/>
              </svg>
            }
          </div>

          <figcaption class="flex items-center gap-3 mt-4 pt-4 border-t border-slate-100">
            <div class="w-10 h-10 rounded-full flex items-center justify-center text-white font-bold text-sm {{ testimonial.avatarColor }}">
              {{ testimonial.name.charAt(0) }}
            </div>
            <div>
              <p class="text-sm font-bold text-slate-900">{{ testimonial.name }}</p>
              <p class="text-xs text-slate-500">{{ testimonial.role }}</p>
            </div>
          </figcaption>
        </figure>
      }
    </div>
  }
</section>
