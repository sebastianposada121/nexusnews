<div class="bg-slate-100/80 rounded-2xl p-6 mb-8 border border-slate-200">
  <label class="block text-sm font-semibold text-slate-700 mb-2">Déjanos tu opinión sobre esta noticia</label>
  <textarea
    #commentInput
    rows="3"
    placeholder="Escribe un comentario respetuoso..."
    class="w-full p-3.5 bg-white border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 mb-3"></textarea>
  <div class="flex justify-end">
    <button
      (click)="publish(commentInput)"
      class="px-5 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-semibold text-sm transition-colors">
      Publicar Comentario
    </button>
  </div>
</div>
