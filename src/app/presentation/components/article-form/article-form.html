<form [formGroup]="articleForm" (ngSubmit)="submit()" class="space-y-4">
  <div>
    <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1">Título de la Noticia *</label>
    <input
      type="text"
      formControlName="title"
      placeholder="Ej. Revolución en Vehículos Eléctricos"
      class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500"
    />
    @if (articleForm.get('title')?.touched && articleForm.get('title')?.invalid) {
      <p class="text-xs text-rose-500 mt-1">El título es requerido (mínimo 5 caracteres).</p>
    }
  </div>

  <div class="grid grid-cols-2 gap-4">
    <div>
      <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1">Categoría *</label>
      <select
        formControlName="category"
        class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500">
        <option value="Tecnología">Tecnología</option>
        <option value="Educación">Educación</option>
        <option value="Turismo">Turismo</option>
        <option value="Comercio">Comercio</option>
      </select>
    </div>

    <div>
      <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1">Autor *</label>
      <input
        type="text"
        formControlName="author"
        placeholder="Nombre de autor"
        class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500"
      />
    </div>
  </div>

  <div>
    <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1">URL de Imagen (Unsplash) *</label>
    <input
      type="url"
      formControlName="image"
      placeholder="https://images.unsplash.com/..."
      class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500"
    />
  </div>

  <div>
    <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1">Resumen Corto *</label>
    <textarea
      formControlName="summary"
      rows="2"
      placeholder="Descripción breve que aparecerá en la tarjeta..."
      class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500"></textarea>
  </div>

  <div>
    <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1">Contenido Completo *</label>
    <textarea
      formControlName="content"
      rows="4"
      placeholder="Desarrollo completo de la noticia..."
      class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500"></textarea>
  </div>

  <div class="flex items-center gap-2 pt-2">
    <input
      type="checkbox"
      id="isFeatured"
      formControlName="isFeatured"
      class="w-4 h-4 text-indigo-600 rounded border-slate-300 focus:ring-indigo-500"
    />
    <label for="isFeatured" class="text-sm text-slate-700 font-medium cursor-pointer">Marcar como noticia destacada en Home</label>
  </div>

  <button
    type="submit"
    [disabled]="articleForm.invalid"
    class="w-full py-3.5 mt-4 rounded-xl bg-indigo-600 hover:bg-indigo-700 disabled:bg-slate-300 text-white font-bold text-sm shadow-md transition-all">
    Guardar y Publicar Noticia
  </button>
</form>
