<article class="bg-white rounded-2xl border border-slate-200/80 shadow-sm hover:shadow-xl transition-all duration-300 flex flex-col overflow-hidden group">
  <div class="relative h-52 overflow-hidden bg-slate-100">
    <img [src]="article().image" [alt]="article().title" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500"/>
    <span class="absolute top-4 left-4 px-3 py-1 rounded-full text-xs font-bold bg-white/90 backdrop-blur-md text-slate-800 shadow-sm">
      {{ article().category }}
    </span>
    <button
      (click)="toggleFavorite(article().id)"
      class="absolute top-4 right-4 p-2.5 rounded-full bg-white/90 backdrop-blur-md text-slate-600 hover:text-amber-500 shadow-sm transition-colors">
      <svg class="w-4 h-4" [class.text-amber-500]="isFavorite(article().id)" [class.fill-current]="isFavorite(article().id)" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z"/>
      </svg>
    </button>
  </div>

  <div class="p-6 flex-grow flex flex-col justify-between">
    <div>
      <div class="flex items-center gap-2 text-xs text-slate-400 font-medium mb-2">
        <span>{{ article().date }}</span>
        <span>•</span>
        <span>{{ article().readTime }}</span>
      </div>
      <h3 class="font-bold text-lg text-slate-900 group-hover:text-indigo-600 transition-colors line-clamp-2 mb-2">
        {{ article().title }}
      </h3>
      <p class="text-sm text-slate-600 line-clamp-3 mb-4 leading-relaxed">
        {{ article().summary }}
      </p>
    </div>

    <div class="pt-4 border-t border-slate-100 flex items-center justify-between">
      <span class="text-xs font-medium text-slate-500">Por {{ article().author }}</span>
      <a [routerLink]="['/noticias', article().id]" class="inline-flex items-center text-xs font-bold text-indigo-600 hover:text-indigo-800 gap-1">
        Ver Más
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
      </a>
    </div>
  </div>
</article>
