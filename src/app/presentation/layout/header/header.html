<header class="sticky top-0 z-40 bg-white/95 backdrop-blur-md border-b border-slate-200 shadow-sm">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex items-center justify-between h-20">

      <a routerLink="/" class="flex items-center gap-3 cursor-pointer group">
        <div class="w-11 h-11 rounded-xl bg-gradient-to-tr from-indigo-600 via-blue-600 to-indigo-800 flex items-center justify-center text-white font-extrabold text-2xl shadow-md shadow-indigo-200 group-hover:scale-105 transition-transform">
          N
        </div>
        <div>
          <span class="text-2xl font-black tracking-tight bg-gradient-to-r from-slate-900 via-indigo-950 to-indigo-700 bg-clip-text text-transparent">
            NEXUS<span class="text-indigo-600">NEWS</span>
          </span>
          <p class="text-[10px] font-bold tracking-widest text-slate-400 uppercase">Periodismo & Experiencias</p>
        </div>
      </a>

      <nav class="hidden md:flex items-center gap-1 bg-slate-100/80 p-1.5 rounded-2xl border border-slate-200/60">
        <a
          routerLink="/"
          #home="routerLinkActive"
          routerLinkActive
          [routerLinkActiveOptions]="{ exact: true }"
          [class]="navButtonClass(home.isActive)">
          <svg class="w-4 h-4 mr-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
          Inicio
        </a>

        <a
          routerLink="/noticias"
          #news="routerLinkActive"
          routerLinkActive
          [class]="navButtonClass(news.isActive)">
          <svg class="w-4 h-4 mr-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h10a2 2 0 012 2v1m2 13a2 2 0 01-2-2V7m2 13a2 2 0 002-2V9a2 2 0 00-2-2h-2m-4-3H9M7 16h6M7 8h6v4H7V8z"/></svg>
          Noticias
        </a>

        <a
          routerLink="/favoritos"
          #fav="routerLinkActive"
          routerLinkActive
          [class]="navButtonClass(fav.isActive)">
          <svg class="w-4 h-4 mr-1.5 text-amber-500" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
          Favoritos
          @if (favoritesCount() > 0) {
            <span class="ml-1.5 px-2 py-0.5 text-xs font-bold rounded-full bg-amber-500 text-white">
              {{ favoritesCount() }}
            </span>
          }
        </a>

        <a
          routerLink="/gestion"
          #crud="routerLinkActive"
          routerLinkActive
          [class]="navButtonClass(crud.isActive)">
          <svg class="w-4 h-4 mr-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"/></svg>
          Crear / Gestionar
        </a>

        <a
          routerLink="/contacto"
          #contact="routerLinkActive"
          routerLinkActive
          [class]="navButtonClass(contact.isActive)">
          <svg class="w-4 h-4 mr-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
          Contacto
        </a>
      </nav>

      <div class="hidden lg:flex items-center gap-3">
        <div class="relative">
          <input
            type="text"
            [value]="searchQuery()"
            (input)="onSearchInput($event)"
            placeholder="Buscar noticia..."
            class="w-48 xl:w-64 pl-9 pr-4 py-2 bg-slate-100 hover:bg-slate-200/70 focus:bg-white text-sm rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-all border border-transparent focus:border-indigo-200"
          />
          <svg class="w-4 h-4 text-slate-400 absolute left-3 top-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
          </svg>
        </div>
      </div>

      <div class="flex md:hidden items-center gap-2">
        <button (click)="toggleMobileMenu()" class="p-2.5 rounded-xl bg-slate-100 text-slate-700 hover:bg-slate-200 focus:outline-none">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            @if (!isMobileMenuOpen()) {
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
            } @else {
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
            }
          </svg>
        </button>
      </div>
    </div>
  </div>

  @if (isMobileMenuOpen()) {
    <div class="md:hidden border-t border-slate-200 bg-white px-4 pt-3 pb-6 space-y-2 animate-fadeIn">
      <div class="mb-3">
        <input
          type="text"
          [value]="searchQuery()"
          (input)="onSearchInput($event)"
          placeholder="Buscar en el diario..."
          class="w-full pl-9 pr-4 py-2.5 bg-slate-100 text-sm rounded-xl border border-slate-200"
        />
      </div>
      <a (click)="toggleMobileMenu()" routerLink="/" class="w-full text-left px-4 py-2.5 rounded-xl font-medium text-slate-700 hover:bg-slate-100 flex items-center">
        Inicio
      </a>
      <a (click)="toggleMobileMenu()" routerLink="/noticias" class="w-full text-left px-4 py-2.5 rounded-xl font-medium text-slate-700 hover:bg-slate-100 flex items-center">
        Noticias & Experiencias
      </a>
      <a (click)="toggleMobileMenu()" routerLink="/favoritos" class="w-full text-left px-4 py-2.5 rounded-xl font-medium text-slate-700 hover:bg-slate-100 flex items-center justify-between">
        <span>Favoritos Guardados</span>
        <span class="px-2 py-0.5 text-xs font-bold rounded-full bg-amber-500 text-white">{{ favoritesCount() }}</span>
      </a>
      <a (click)="toggleMobileMenu()" routerLink="/gestion" class="w-full text-left px-4 py-2.5 rounded-xl font-medium text-slate-700 hover:bg-slate-100 flex items-center">
        Crear / Publicar Noticia
      </a>
      <a (click)="toggleMobileMenu()" routerLink="/contacto" class="w-full text-left px-4 py-2.5 rounded-xl font-medium text-slate-700 hover:bg-slate-100 flex items-center">
        Contacto y Feedback
      </a>
    </div>
  }
</header>
